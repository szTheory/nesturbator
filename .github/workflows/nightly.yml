# Nightly full 65x02 vector run (CPU-02; ENGINEERING section 5). It is
# outside `CI required`: a red nightly opens an issue and blocks nothing.
# `cmake --workflow --preset vectors-full` fetches the full set by git at the
# pin in tests/vectors/pins.txt, checks every file's SHA-256, and runs all
# 2,560,000 tests. There is no cache (Phase 2 D-21): a cache used every night
# stays warm forever, and the fetch at the pin would stop being tested.
# `cmake --workflow --preset mmc3-oracle` is the second lane (09 D-10): it
# fetches blargg's mmc3_test_2 and mmc3_irq_tests at the pin in
# tests/mmc3/pins.txt, checks every ROM's SHA-256, and runs the 12 rows of
# tests/mmc3/oracle.txt. It has no cache, no write permission and no skip code
# either, and it is not part of ci.yml or the CI required set.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Linux execution fuzz mode (bounded pilot or measured campaign)
        required: true
        type: choice
        options: [pilot, campaign]
        default: campaign
  push:
    branches: [main]
  # A pull request that changes the nightly's own inputs runs it too, since a
  # schedule runs only on the default branch. The lane builds the whole `ci`
  # tree; the list is the files that can change what its vectors-full tests
  # run: its presets and test registrations, the fetch, converter and run
  # scripts, the harness, and the CPU with the header and build file it is
  # compiled from, whose full 10000-test behaviour only this lane exercises.
  # Release Please PRs already run required CI for source changes on main; the
  # non-required Nightly lanes skip those generated PRs and run on the main push.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - CMakeLists.txt
      - CMakePresets.json
      - include/nesturbator.h
      - tests/CMakeLists.txt
      - tests/vectors/**
      - tests/cpu/**
      - tests/cmake/fetch_vectors.cmake
      - tests/cmake/vectors_full_run.cmake
      - tests/cmake/vectors_sample_match.cmake
      - tests/cmake/vector_registration_policy.cmake
      - tools/vecconv/**
      - src/cpu.c
      - src/internal.h
      - tests/fuzz/**
      - tests/roms/manifest.txt
      - tests/mmc3/**
      - tests/cmake/fetch_blargg_mmc3.cmake
      - tests/cmake/mmc3_oracle_run.cmake
      - tests/cmake/mmc3_oracle_inventory.cmake
      - src/mapper_mmc3.c
      - src/mapper.h
      - src/ppu.c
      - src/cartridge.c
      - src/bus.c

permissions: {}

jobs:
  vectors-full:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # The fetch is a network transfer, so it gets its own allowance, the 900 s
    # TIMEOUT of cpu.vectors-full.fetch in tests/CMakeLists.txt; the rest gets
    # twice the slowest whole job of 36 sampled successful runs, 166 s in run 38341228998,
    # so TIMEOUT + 2S = 900 + 332 = 1232 s, rounded up to 21 minutes, ENGINEERING section 5.
    timeout-minutes: 21
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.keys.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GCC 14, as in ci.yml; the image's default gcc is 13.
      - name: Linux toolchain
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      # Configure without running the fetch fixture, then preserve the exact
      # inventory checked before the network-backed workflow starts.
      - name: Record and check full-tier inventory
        run: |
          cmake --preset vectors-full
          ctest --test-dir build/vectors-full --show-only=json-v1 > build/vectors-full/registered-tests.json
          cmake -DROOT="$GITHUB_WORKSPACE" \
            -DINVENTORY_FILE="$GITHUB_WORKSPACE/build/vectors-full/registered-tests.json" \
            -DFULL_ONLY=ON -P tests/cmake/vector_registration_policy.cmake
      - run: cmake --workflow --preset vectors-full
      # The failed tests as report keys: cpu.vectors-full.<xx> becomes
      # 65x02/<xx>; fetch and sample-match keep their names.
      - name: Failed keys
        id: keys
        if: always()
        run: |
          log=build/vectors-full/Testing/Temporary/LastTestsFailed.log
          keys=""
          if [ -f "$log" ]; then
            keys=$(cut -d: -f2- "$log" \
              | sed -n 's/^cpu\.vectors-full\.//p' \
              | sed -E 's|^([0-9a-f]{2})$|65x02/\1|' \
              | sort | tr '\n' ' ' | sed 's/ $//')
          fi
          printf 'failed: %s\n' "${keys:-none}"
          echo "failed=$keys" >> "$GITHUB_OUTPUT"
      - name: Verify run evidence
        if: always()
        run: |
          test -s build/vectors-full/registered-tests.json
          test -s build/vectors-full/vectors-full.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vectors-full-evidence-${{ github.run_id }}
          path: |
            build/vectors-full/registered-tests.json
            build/vectors-full/vectors-full.junit.xml
          if-no-files-found: error
      - name: Record run identity
        if: always()
        env:
          ARTIFACT: vectors-full-evidence-${{ github.run_id }}
        run: |
          printf 'event: %s\nhead SHA: %s\nrun: %s/%s/actions/runs/%s\nartifact: %s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

  mmc3-oracle:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # The fetch is a network transfer, so it gets its own allowance, the 300 s
    # TIMEOUT of mmc3.oracle.fetch in tests/CMakeLists.txt; the rest gets twice
    # the slowest whole job of 39 sampled successful runs, 41 s in run 38398904800,
    # so TIMEOUT + 2S = 300 + 82 = 382 s, rounded up to 7 minutes, ENGINEERING section 5.
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.keys.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GCC 14, as in ci.yml; the image's default gcc is 13.
      - name: Linux toolchain
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      # Configure without running the fetch fixture, then preserve the exact
      # inventory checked before the network-backed workflow starts.
      - name: Record full-lane inventory
        run: |
          cmake --preset mmc3-oracle
          ctest --test-dir build/mmc3-oracle --show-only=json-v1 > build/mmc3-oracle/registered-tests.json
      - run: cmake --workflow --preset mmc3-oracle
      # The failed tests as report keys: mmc3.oracle.<key> becomes <key>;
      # the fetch test keeps its name.
      - name: Failed keys
        id: keys
        if: always()
        run: |
          log=build/mmc3-oracle/Testing/Temporary/LastTestsFailed.log
          keys=""
          if [ -f "$log" ]; then
            keys=$(cut -d: -f2- "$log" \
              | sed -E 's/^mmc3\.oracle\.(mmc3_)/\1/' \
              | sort | tr '\n' ' ' | sed 's/ $//')
          fi
          printf 'failed: %s\n' "${keys:-none}"
          echo "failed=$keys" >> "$GITHUB_OUTPUT"
      - name: Verify run evidence
        if: always()
        run: |
          test -s build/mmc3-oracle/registered-tests.json
          test -s build/mmc3-oracle/mmc3-oracle.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mmc3-oracle-evidence-${{ github.run_id }}
          path: |
            build/mmc3-oracle/registered-tests.json
            build/mmc3-oracle/mmc3-oracle.junit.xml
          if-no-files-found: error
      - name: Record run identity
        if: always()
        env:
          ARTIFACT: mmc3-oracle-evidence-${{ github.run_id }}
        run: |
          printf 'event: %s\nhead SHA: %s\nrun: %s/%s/actions/runs/%s\nartifact: %s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

  rom-loader-fuzz:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # Twice the slowest of 40 sampled successful runs: 85 s in run 38347599457, rounded up to 3 minutes, ENGINEERING section 5.
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.fuzz.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify local corpus and Clang
        run: |
          test -d tests/fuzz/corpus
          test -n "$(find tests/fuzz/corpus -type f -print -quit)"
          clang --version
      - name: Configure sanitized libFuzzer target
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_FLAGS=-fsanitize=fuzzer-no-link,address,undefined\ -fno-sanitize-recover=all\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DNESTURBATOR_LIBFUZZER=ON
      - name: Build bounded ROM loader fuzzer
        run: cmake --build build/fuzz --target fuzz.rom_loader.libfuzzer
      - name: Run bounded ROM loader mutation test
        id: fuzz
        run: |
          test -x build/fuzz/tests/fuzz.rom_loader.libfuzzer
          test -n "$(find tests/fuzz/corpus -type f -print -quit)"
          build/fuzz/tests/fuzz.rom_loader.libfuzzer \
            -max_total_time=60 -timeout=2 -max_len=65536 tests/fuzz/corpus
      - name: Record fuzz outcome
        if: always()
        env:
          OUTCOME: ${{ steps.fuzz.outcome }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf 'ROM loader libFuzzer outcome: **%s**\n\nHead SHA: `%s`\n\nRun: %s/%s/actions/runs/%s\n' \
            "$OUTCOME" "$HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "$GITHUB_STEP_SUMMARY"

  state-fuzz:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # Twice the slowest of 37 sampled successful runs: 99 s in run 38289608338, rounded up to 4 minutes, ENGINEERING section 5.
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.fuzz.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify state corpus and Clang
        run: |
          test -d tests/fuzz/corpus_state
          test -n "$(find tests/fuzz/corpus_state -type f -print -quit)"
          clang --version
      - name: Configure sanitized libFuzzer target
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_FLAGS=-fsanitize=fuzzer-no-link,address,undefined\ -fno-sanitize-recover=all\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DNESTURBATOR_LIBFUZZER=ON
      - name: Build bounded state loader fuzzer
        run: cmake --build build/fuzz --target fuzz.state.libfuzzer
      - name: Run bounded state loader mutation test
        id: fuzz
        run: |
          test -x build/fuzz/tests/fuzz.state.libfuzzer
          test -n "$(find tests/fuzz/corpus_state -type f -print -quit)"
          mkdir -p build/fuzz/state-artifacts
          build/fuzz/tests/fuzz.state.libfuzzer \
            -max_total_time=60 -timeout=5 -max_len=65536 \
            -artifact_prefix=build/fuzz/state-artifacts/ tests/fuzz/corpus_state
      - name: Hex dump crash inputs
        if: failure()
        run: |
          for f in build/fuzz/state-artifacts/crash-*; do
            [ -e "$f" ] || continue
            printf '### %s\n\n```\n' "$f" >> "$GITHUB_STEP_SUMMARY"
            head -c 512 "$f" | od -An -tx1 -v >> "$GITHUB_STEP_SUMMARY"
            printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-fuzz-artifacts-${{ github.run_id }}
          path: build/fuzz/state-artifacts/
          if-no-files-found: ignore
      - name: Record fuzz outcome
        if: always()
        env:
          OUTCOME: ${{ steps.fuzz.outcome }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf 'State loader libFuzzer outcome: **%s**\n\nHead SHA: `%s`\n\nRun: %s/%s/actions/runs/%s\n' \
            "$OUTCOME" "$HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            >> "$GITHUB_STEP_SUMMARY"

  execution-fuzz:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # Pilot completed in 33 s (run 40129666207); the 180 s process cap plus
    # 120 s for self-test, artifact upload and cleanup fits the 5-minute
    # network-bound job floor, ENGINEERING section 5.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.campaign.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Linux Clang and execution recipes
        run: |
          clang --version
          test -s tests/fuzz/execution-budgets.txt
          test -n "$(find tests/fuzz/corpus_execution -type f -print -quit)"
      - name: Run bounded execution campaign
        id: campaign
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'pilot' && 'pilot' || 'campaign' }}
        run: |
          if [ "$MODE" = pilot ]; then
            DRIVER=tests/cmake/execution_measure.cmake
          else
            DRIVER=tests/cmake/execution_campaign.cmake
          fi
          timeout 180s cmake \
            -DSOURCE_DIR="$GITHUB_WORKSPACE" \
            -DBUILD_DIR="$GITHUB_WORKSPACE/build/execution-fuzz-build" \
            -DOUTPUT_DIR="$GITHUB_WORKSPACE/build/execution-fuzz-evidence/$GITHUB_RUN_ID" \
            -DBUDGET_FILE=tests/fuzz/execution-budgets.txt \
            -DMODE="$MODE" -P "$DRIVER"
      - name: Verify deliberate artifact controls
        if: always()
        run: |
          cmake \
            -DSOURCE_DIR="$GITHUB_WORKSPACE" \
            -DBUILD_DIR="$GITHUB_WORKSPACE/build/execution-fuzz-build" \
            -DOUTPUT_DIR="$GITHUB_WORKSPACE/build/execution-fuzz-evidence/$GITHUB_RUN_ID/self-test" \
            -DBUDGET_FILE=tests/fuzz/execution-budgets.txt \
            -DMODE=self-test -P tests/cmake/execution_campaign.cmake
          test -s "build/execution-fuzz-evidence/$GITHUB_RUN_ID/self-test/reproducers/rom-loader/crash-synthetic-control"
          test -s "build/execution-fuzz-evidence/$GITHUB_RUN_ID/self-test/reproducers/rom-loader/timeout-synthetic-control"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: execution-fuzz-evidence-${{ github.run_id }}
          path: build/execution-fuzz-evidence/${{ github.run_id }}/
          if-no-files-found: error
      - name: Record execution fuzz outcome
        if: always()
        env:
          OUTCOME: ${{ steps.campaign.outcome }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode || 'campaign' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf 'Execution fuzz mode: **%s**\n\nOutcome: **%s**\n\nHead SHA: `%s`\n\nRun: %s/%s/actions/runs/%s\n\nArtifact: `execution-fuzz-evidence-%s`\n' \
            "$MODE" "$OUTCOME" "$HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  # Hunts flakes that parallel CTest could expose: the ci preset's suite three
  # times in random order, failing on any failure. Linux only; the PR's
  # six-platform CI run covers the other hosts once.
  suite-flake:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: ubuntu-24.04
    # The 40-minute cap was based on 39 successful samples (1173 s maximum).
    # Exact-head run 40136996662 reached the third session-controls repeat at
    # the cap; its first two repeats took 450.35 s and 451.35 s. Allow 50 min
    # for that observed tail plus the remaining suite and cleanup.
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.flake.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux toolchain
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      - name: Prepare protected-main scoreboard baseline
        run: cmake -P tests/cmake/prepare_scoreboard_baseline.cmake
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - name: Run the suite three times in random order
        id: flake
        run: ctest --preset ci -LE '^retroarch-session$' --repeat until-fail:3 --schedule-random

  # Linux and Apple Silicon run these once per required CI invocation. Keep
  # Intel coverage here rather than multiplying the serial matrix on every PR.
  session-controls:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'nesturbator-release[bot]' ||
      !startsWith(github.event.pull_request.title, 'chore(main): release ')
    runs-on: macos-15-intel
    # Successful Intel build run 38645462773 took 1,151 s including the matrix;
    # retain that measured 39-minute envelope until this isolated job is measured.
    timeout-minutes: 39
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset ci
      - run: cmake --build --preset ci --target frame_index nesturbator-run
      - run: ctest --preset ci -L '^retroarch-session$' --no-tests=error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nightly-session-controls-intel
          path: build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  # On scheduled and main-push runs: one rolling issue labelled nightly,
  # opened or updated on failure and closed on success. No checkout, so gh is
  # given the repository.
  report:
    needs: [vectors-full, mmc3-oracle, rom-loader-fuzz, state-fuzz, execution-fuzz, suite-flake, session-controls]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    # 5-minute floor for a network-bound job, ENGINEERING section 5; twice the slowest of 3 sampled successful runs (5 s in run 38329002573) is 1 minutes.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.vectors-full.result == 'success' && needs.mmc3-oracle.result == 'success' && needs.rom-loader-fuzz.result == 'success' && needs.state-fuzz.result == 'success' && needs.execution-fuzz.result == 'success' && needs.suite-flake.result == 'success' && needs.session-controls.result == 'success' && 'success' || 'failure' }}
          FAILED: ${{ needs.vectors-full.outputs.failed }}
          MMC3: ${{ needs.mmc3-oracle.outputs.failed }}
          FUZZ: ${{ needs.rom-loader-fuzz.outputs.outcome }}
          STATE_FUZZ: ${{ needs.state-fuzz.outputs.outcome }}
          EXECUTION_FUZZ: ${{ needs.execution-fuzz.outputs.outcome }}
          FLAKE: ${{ needs.suite-flake.outputs.outcome }}
          SESSIONS: ${{ needs.session-controls.result }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create nightly --force --repo "$GITHUB_REPOSITORY" \
            --description "Nightly lanes"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number -q '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Passed for $EVENT at $HEAD_SHA in $url"
            fi
            exit 0
          fi
          body=$(printf 'Event: %s\n\nHead SHA: %s\n\nRun: %s\n\nOverall result: %s\n\nFailed vector keys: %s\n\nFailed MMC3 oracle keys: %s\n\nROM loader fuzz outcome: %s\n\nState loader fuzz outcome: %s\n\nExecution fuzz outcome: %s\n\nSuite flake hunt outcome: %s\n\nIntel session controls: %s\n' \
            "$EVENT" "$HEAD_SHA" "$url" "$RESULT" "${FAILED:-none recorded; see the run}" "${MMC3:-none recorded; see the run}" "${FUZZ:-not recorded; see the run}" "${STATE_FUZZ:-not recorded; see the run}" "${EXECUTION_FUZZ:-not recorded; see the run}" "${FLAKE:-not recorded; see the run}" "${SESSIONS:-not recorded; see the run}")
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" \
              --label nightly --body "$body"
          fi
