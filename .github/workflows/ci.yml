# Continuous integration (ENGINEERING section 5). Every job runs the same
# `cmake --workflow --preset <lane>` command as a local build. The ruleset
# requires one check, `CI required`, which passes only when every other job
# succeeded.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# No trigger-level path filter: a workflow skipped by paths leaves the
# required check pending and blocks merging.

permissions:
  contents: read

# Only a pull request's runs supersede each other, so every main commit keeps
# a result. A title edit also starts a run and cancels the one in progress.
# The workflow name is part of the group because a call from release.yml sees
# the caller's context: its run must not queue behind, or be replaced by, the
# push run on the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 1 # twice the cold run 37084642541 (21 s), rounded up to whole minutes (ENGINEERING §5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-format 18.1.3 is on the image.
      - run: cmake --workflow --preset hygiene

  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 1 # twice the cold run 37084642541 (2 s), rounded up to whole minutes (ENGINEERING §5)
    permissions:
      pull-requests: read
    steps:
      # The live title, so a re-run after an edit sees the new one. The job
      # has no checkout, so gh is given the repository.
      - name: Pull-request title is a Conventional Commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request"
            exit 0
          fi
          title=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          printf 'title: %s\n' "$title"
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s\n' "$title" | grep -Eq "$re"; then
            echo "::error::the title must match $re"
            exit 1
          fi

  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7 # twice the slowest observed workflow, 198 s on macOS Intel including packaging; rounded up (ENGINEERING §5)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, preset: ci, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, preset: ci, os: linux, arch: arm64 }
          - { runner: macos-15, preset: ci, os: macos, arch: arm64 }
          - { runner: macos-15-intel, preset: ci, os: macos, arch: x64 }
          - { runner: windows-2025, preset: ci-msvc, os: windows, arch: x64 }
          - { runner: windows-11-arm, preset: ci-msvc, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GCC 14; the image's default gcc is 13. The arm64 image does not list
      # Ninja.
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      # The MSVC developer environment for the runner's own architecture,
      # without a third-party action.
      - name: Load MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV } }
      # Establish the regression baseline from protected main before any
      # candidate-controlled CTest configuration or scoreboard files run.
      - name: Prepare protected-main scoreboard baseline
        run: cmake -P tests/cmake/prepare_scoreboard_baseline.cmake
      - run: cmake --workflow --preset ${{ matrix.preset }}
      - run: cmake -DDIR=build/${{ matrix.preset }} -P tests/cmake/check_archives.cmake
      - if: matrix.os == 'macos' && matrix.arch == 'arm64'
        run: cmake -DREADME=README.md -DPACKAGES=build/${{ matrix.preset }}/packages -DOUT=build/install-line -P tests/cmake/check_install_line.cmake
      # Quote each -D argument for PowerShell; the movie writer's executable
      # suffix is platform-specific.
      - run: cmake "-DBUILD=build/${{ matrix.preset }}" "-DOUT=hashes.txt" "-DMOVIE_WRITER=build/${{ matrix.preset }}/tests/runner.game_movie${{ runner.os == 'Windows' && '.exe' || '' }}" -P tests/cmake/write_hashes.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/packages/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.arch }}
          path: hashes.txt
          if-no-files-found: error

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # run 38097794967 took 4m14s; run 38108603663 hit the old 5-minute cap at 444/446 after Phase 9 added five mapper 4 ROM runs of about 45 s each under ASan
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare protected-main scoreboard baseline
        run: cmake -P tests/cmake/prepare_scoreboard_baseline.cmake
      - run: cmake --workflow --preset asan

  nofp:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2 # twice the slowest measured run 37084642541 (38 s, ubuntu-24.04), rounded up to two minutes (ENGINEERING §5)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ninja
        run: command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      - run: cmake --workflow --preset nofp

  # The same inputs give the same hashes on every platform: all six
  # hashes.txt files must be byte-identical.
  hash-equality:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 1 # twice the cold run 37084642541 (5 s), rounded up to whole minutes (ENGINEERING §5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          path: hashes
      - name: Hashes are byte-identical
        run: cmake -DROOT="${{ github.workspace }}/hashes" -P tests/cmake/hash_inventory.cmake

  # Required hosted proof using the pinned released app and a manifest-listed
  # game. Its screenshot is retained for diagnosis and reproducibility.
  retroarch-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare protected-main scoreboard baseline
        run: cmake -P tests/cmake/prepare_scoreboard_baseline.cmake
      - name: Build and run the local test suite
        run: cmake --workflow --preset ci
      - name: Install and verify the pinned RetroArch candidate
        env:
          RETROARCH_URL: https://buildbot.libretro.com/stable/1.22.2/apple/osx/universal/RetroArch_Metal.dmg
          RETROARCH_SHA256: 81b79121ba26d539064ae13b4d0419a120c3d165afbe656cf5f5412b15fdb434
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/build/retroarch-e2e"
          mkdir -p "$dir/mount"
          curl --fail --location --retry 2 "$RETROARCH_URL" --output "$dir/RetroArch.dmg"
          actual=$(shasum -a 256 "$dir/RetroArch.dmg" | awk '{print $1}')
          printf 'asset URL: %s\nexpected SHA-256: %s\nactual SHA-256: %s\n' \
            "$RETROARCH_URL" "$RETROARCH_SHA256" "$actual" | tee "$dir/asset-evidence.txt"
          test "$actual" = "$RETROARCH_SHA256"
          hdiutil attach "$dir/RetroArch.dmg" -nobrowse -readonly -mountpoint "$dir/mount"
          ditto "$dir/mount/RetroArch.app" "$dir/RetroArch.app"
          hdiutil detach "$dir/mount"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$dir/RetroArch.app/Contents/Info.plist")
          printf 'RetroArch version: %s\n' "$version" | tee -a "$dir/asset-evidence.txt"
          test "$version" = 1.22.2
      - name: Compare the hosted RetroArch game frame
        run: >-
          cmake
          -DCORE="$GITHUB_WORKSPACE/build/ci/libretro/nesturbator_libretro.dylib"
          -DINFO="$GITHUB_WORKSPACE/libretro/nesturbator_libretro.info"
          -DRUNNER="$GITHUB_WORKSPACE/build/ci/runner/nesturbator-run"
          -DCOMPARE="$GITHUB_WORKSPACE/build/ci/tests/retroarch/compare_frame"
          -DRA_DIR="$GITHUB_WORKSPACE/build/retroarch-e2e/run"
          -DTEMPLATE="$GITHUB_WORKSPACE/tests/retroarch/test.cfg.in"
          -DROM="$GITHUB_WORKSPACE/tests/roms/nesteroids.nes"
          -DFRAME=60
          -DRETROARCH="$GITHUB_WORKSPACE/build/retroarch-e2e/RetroArch.app/Contents/MacOS/RetroArch"
          -DEXPECTED_VERSION=1.22.2
          -DVERSION_PLIST="$GITHUB_WORKSPACE/build/retroarch-e2e/RetroArch.app/Contents/Info.plist"
          -P tests/retroarch/run_retroarch.cmake
      - name: Compare the RetroArch battery save round trip
        run: >-
          cmake
          -DCORE="$GITHUB_WORKSPACE/build/ci/libretro/nesturbator_libretro.dylib"
          -DINFO="$GITHUB_WORKSPACE/libretro/nesturbator_libretro.info"
          -DRUNNER="$GITHUB_WORKSPACE/build/ci/runner/nesturbator-run"
          -DCOMPARE="$GITHUB_WORKSPACE/build/ci/tests/retroarch/compare_frame"
          -DRA_DIR="$GITHUB_WORKSPACE/build/retroarch-e2e/run-save"
          -DTEMPLATE="$GITHUB_WORKSPACE/tests/retroarch/test.cfg.in"
          -DSAVE_ROM="$GITHUB_WORKSPACE/tests/roms/hm/M1_P512K_CR8K_S32K.nes"
          -DSAVE_FRAME=400
          -DRETROARCH="$GITHUB_WORKSPACE/build/retroarch-e2e/RetroArch.app/Contents/MacOS/RetroArch"
          -DEXPECTED_VERSION=1.22.2
          -DVERSION_PLIST="$GITHUB_WORKSPACE/build/retroarch-e2e/RetroArch.app/Contents/Info.plist"
          -P tests/retroarch/run_retroarch.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-e2e-frames
          path: |
            build/retroarch-e2e/asset-evidence.txt
            build/retroarch-e2e/run/runner-game.ppm
            build/retroarch-e2e/run/shot-game.png
            build/retroarch-e2e/run/shot-game.bmp
            build/retroarch-e2e/run-save/runner-s1.ppm
            build/retroarch-e2e/run-save/runner-s2.ppm
            build/retroarch-e2e/run-save/shot-s1.png
            build/retroarch-e2e/run-save/shot-s1.bmp
            build/retroarch-e2e/run-save/shot-s2.png
            build/retroarch-e2e/run-save/shot-s2.bmp
            build/retroarch-e2e/run-save/saves/M1_P512K_CR8K_S32K.srm
          if-no-files-found: error

  # The one required check. GitHub reports a skipped job as success and skips
  # a job whose dependency failed, so this runs always and requires every
  # result to be success.
  ci-required:
    name: CI required
    if: always()
    needs: [hygiene, title, build, asan, nofp, hash-equality, retroarch-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 1 # twice the cold run 37084642541 (4 s), rounded up to whole minutes (ENGINEERING §5)
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
